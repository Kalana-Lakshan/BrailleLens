<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- One Braille cell: dots 1-2 raised (letter "b" for BrailleLens), dots 3-6 flat.
       Colours follow the poster's navy-to-green gradient. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143973"/>
      <stop offset=".55" stop-color="#114d63"/>
      <stop offset="1" stop-color="#0f694e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#g)"/>
  <circle cx="23" cy="16" r="6" fill="#ffffff"/>
  <circle cx="23" cy="32" r="6" fill="#ffffff"/>
  <circle cx="23" cy="48" r="5" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="41" cy="16" r="5" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="41" cy="32" r="5" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="41" cy="48" r="5" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>
</svg>
