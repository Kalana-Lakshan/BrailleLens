name: braille_lens_flutter
description: "BrailleLens 100% Offline Interactive Mobile App for Braille Character Classification"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  onnxruntime: ^1.2.0
  image: ^4.5.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  camera: ^0.11.0
  audioplayers: ^6.1.0
  http: ^1.2.2

  # RTSP live preview from the AI Glass. libmpv handles the H.264 depacketise
  # + decode, so no custom native decoder is needed on our side.
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_android_video: ^1.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/models/braille_cnn.onnx
    - assets/models/braille_labels.json
    - assets/models/fingertip_braille_yolo26n.onnx
    - assets/models/fingertip_braille_yolo26n_mobile.onnx
    - assets/models/fingertip_braille_yolo26n_meta.json
    - assets/models/braille_cell_yolo26n.onnx
    - assets/models/braille_cell_yolo26n_mobile.onnx
    - assets/models/braille_cell_yolo26n_meta.json
    - assets/samples/
