[pytest]
pythonpath = .
testpaths =
    data_pipeline/tests
    cell_detect/tests
    braille_cnn/tests
    yolo_dot_detect/tests
    finger_cell_track/tests
    camera_capture/tests
addopts = -q --strict-markers
filterwarnings =
    ignore:cannot collect test class 'TestingMode':pytest.PytestCollectionWarning
markers =
    slow: optional tests that need weights or a camera
